name: ci

# Every check here exists because a rule somewhere requires it, and the rule is named on the
# step. A gate whose reason is not written down is a gate someone deletes to make a build green.

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "41 3 * * 1"

permissions:
  contents: read

env:
  # A minor version, not a patch. The patch a runner resolves is a testing detail; pinning it
  # here would turn every Go security release into a manual bump in this file. The supply-chain
  # job disagrees on purpose — see its setup-go step.
  GO_VERSION: "1.26"

jobs:
  verify:
    runs-on: ubuntu-latest

    # A disposable PostgreSQL. The Week 1 exit criterion is a property of a database that no
    # fake can answer, and TDD-organization-control-001 is explicit about why: an isolation test
    # executed on an administrative or owning connection is not isolation evidence. Proving
    # cross-tenant denial requires the actual runtime role against a real engine.
    services:
      postgres:
        # Pinned by digest, not by tag, so a run six months from now tests the same server.
        # PostgreSQL 17 matches what foundation-platform is verified against; a different major
        # version here would validate a plan for the wrong engine.
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: organization
          POSTGRES_PASSWORD: organization
          POSTGRES_DB: organization_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U organization"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      # Atlas computes a diff by materialising the desired state on a throwaway server. It must
      # be a separate database from the one under test: Atlas drops and recreates everything in
      # the dev database on every command.
      atlas-dev:
        image: postgres:17-alpine@sha256:742f40ea20b9ff2ff31db5458d127452988a2164df9e17441e191f3b72252193
        env:
          POSTGRES_USER: atlas
          POSTGRES_PASSWORD: atlas
          POSTGRES_DB: atlas_dev
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U atlas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_DATABASE_URL: postgres://organization:organization@localhost:5432/organization_test?sslmode=disable
      ORGANIZATION_MIGRATION_DATABASE_URL: postgres://organization:organization@localhost:5432/organization_test?sslmode=disable
      # Both URLs are database-scoped, with no search_path. That differs from identity-control
      # and is forced rather than chosen: Atlas rejects a multi-schema HCL source against a
      # schema-scoped URL — "cannot use HCL with more than 1 schema when dev-url is limited to
      # schema". atlas.hcl bounds the scope with `schemas` and `exclude` instead.
      DATABASE_URL: postgres://organization:organization@localhost:5432/organization_test?sslmode=disable
      ATLAS_DEV_URL: postgres://atlas:atlas@localhost:5433/atlas_dev?sslmode=disable
      # The isolation suite connects as the roles production traffic uses, never as the owner.
      # These are the login roles created below, and they exist only inside this job.
      TEST_RUNTIME_PASSWORD: runtime
      TEST_PROVIDER_PASSWORD: provider
      # Turns a skipped isolation suite into a failure. Without it, a service container that
      # never came up would leave every cross-tenant assertion unrun and the build green, which
      # is indistinguishable from having proven isolation.
      REQUIRE_INTEGRATION: "1"

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          check-latest: false

      - uses: ariga/setup-atlas@e181c50e3c1e8b7fbe10617f2a4a0fbc0d2b9c4a # v0
        with:
          version: latest

      - name: gofmt
        run: |
          unformatted=$(gofmt -l .)
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt reports unformatted files:"
            echo "$unformatted"
            exit 1
          fi

      - name: go vet
        run: go vet ./...

      - name: build
        run: go build ./...

      # Integrity of the migration directory. atlas.sum is a checksum over every file, so this
      # fails when a committed migration was edited after generation — which is how a reviewed
      # plan and an applied plan quietly stop being the same thing.
      - name: atlas migration directory integrity
        run: atlas migrate validate --env ci

      # ADR-GLB-004 requires the pipeline to block a destructive plan rather than report one,
      # and names `atlas migrate lint` as the mechanism. Since Atlas v0.38 that command is
      # available only to Atlas Pro accounts, so the mandated gate cannot run on the free CLI.
      #
      # This is the interim replacement. It is cruder than the analyzer it stands in for — it
      # reads text rather than a parsed plan — but it fails, which is the property that matters,
      # and it is recorded as debt in ROADMAP.md rather than presented as equivalent.
      - name: destructive statements are blocked
        run: |
          pattern='DROP TABLE|DROP SCHEMA|DROP COLUMN|DROP CONSTRAINT|DROP INDEX|RENAME TO|RENAME COLUMN|TRUNCATE'
          if grep -nEi "$pattern" migrations/*.sql | grep -v 'atlas:destructive-approved'; then
            echo "::error::a migration contains a destructive statement; a multi-phase deployment is required by STD-GLB-002, or annotate the line with atlas:destructive-approved after review"
            exit 1
          fi
          echo "no destructive statements in migrations/"

      # A migration directory that no longer matches schema.hcl is drift that would be applied
      # silently on the next deploy.
      #
      # `atlas migrate diff` has no --dry-run, so the check is the command plus its effect: diff
      # writes a migration only when the directory and schema.hcl disagree, and a clean tree
      # afterwards proves they agree.
      - name: atlas migration directory is in sync with schema.hcl
        run: |
          atlas migrate diff --env ci drift_check
          if [ -n "$(git status --porcelain migrations/)" ]; then
            echo "::error::atlas wrote a new migration; schema.hcl has changes that are not in migrations/"
            git status --porcelain migrations/
            exit 1
          fi

      # The order is not arbitrary, and it differs from identity-control's.
      #
      # Roles first, because they are cluster objects: creating them leaves the database clean,
      # and Atlas refuses to apply against one it considers unclean. Atlas second, so it sees a
      # clean database. The platform schema third rather than first, because in database scope
      # any pre-existing schema makes the database unclean — including `platform`, and including
      # one named in `exclude`, which the clean check does not consult.
      - name: apply cluster roles
        run: go run ./cmd/organization-migrate -stage=pre

      - name: apply the owned schemas
        run: atlas migrate apply --env ci

      # The stage verifies its own work before returning success: applying SQL and achieving a
      # posture are different claims, and controldb.AssertIsolation is the difference. A deploy
      # that applied rls.sql without protecting every table fails here rather than shipping an
      # inert control.
      - name: apply the platform schema, Row-Level Security, and privileges
        run: go run ./cmd/organization-migrate -stage=post

      # The isolation suite connects as these, never as the owner. Group roles are NOLOGIN by
      # design, so a login role that inherits one is how a deployable authenticates —
      # TDD-organization-control-001 requires the test to use the role that carries production
      # traffic, and that role cannot be the one this job authenticates the migration with.
      - name: create the runtime login roles
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='organization_app') THEN
              CREATE ROLE organization_app LOGIN;
            END IF;
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname='organization_provider_app') THEN
              CREATE ROLE organization_provider_app LOGIN;
            END IF;
          END
          $$;
          ALTER ROLE organization_app          WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'runtime';
          ALTER ROLE organization_provider_app WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOBYPASSRLS PASSWORD 'provider';
          GRANT organization_rt          TO organization_app;
          GRANT organization_provider_rt TO organization_provider_app;
          SQL
        env:
          PGPASSWORD: organization

      # Two Tenants, because cross-tenant denial cannot be proven with one. Seeded on the
      # administrative connection deliberately: the fixture is not the thing under test, and
      # seeding through a bound runtime role would make the test assert its own setup.
      - name: seed two Tenants
        run: |
          psql "$TEST_DATABASE_URL" -v ON_ERROR_STOP=1 <<'SQL'
          INSERT INTO organization.organization (organization_id, display_name, classification, status)
          VALUES ('00000000-0000-4000-8000-00000000000a','Org A','customer','active'),
                 ('00000000-0000-4000-8000-00000000000b','Org B','customer','active')
          ON CONFLICT DO NOTHING;
          INSERT INTO tenant.tenant (tenant_id, organization_id, display_name, status, isolation_profile)
          VALUES ('11111111-1111-4111-8111-11111111111a','00000000-0000-4000-8000-00000000000a','Tenant A','active','pooled'),
                 ('11111111-1111-4111-8111-11111111111b','00000000-0000-4000-8000-00000000000b','Tenant B','active','pooled')
          ON CONFLICT DO NOTHING;
          INSERT INTO membership.membership (membership_id, principal_id, tenant_id, subject_type, status, valid_from, provenance)
          VALUES ('22222222-2222-4222-8222-22222222222a','33333333-3333-4333-8333-33333333333a','11111111-1111-4111-8111-11111111111a','human','active',now(),'migration'),
                 ('22222222-2222-4222-8222-22222222222b','33333333-3333-4333-8333-33333333333b','11111111-1111-4111-8111-11111111111b','human','active',now(),'migration')
          ON CONFLICT DO NOTHING;
          SQL
        env:
          PGPASSWORD: organization

      # The race detector is the only thing separating correct synchronisation from
      # synchronisation that has been lucky.
      - name: test with race detector
        run: go test ./... -race -count=1

      # This is the Week 1 exit criterion, asserted against the catalog and against the engine
      # rather than against the SQL that produced them. Verbose because each assertion names a
      # control, and a reviewer reading a red build should see which one.
      - name: prove tenant isolation as the runtime role
        run: go test ./internal/controldb/... ./internal/db/... -count=1 -v

      # Reused from foundation-platform rather than reimplemented. The rules live in arch.json
      # beside the code they constrain.
      - name: architecture boundaries
        run: go run github.com/anshacerbia2/foundation-platform/tools/archcheck

  supply-chain:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version: ${{ env.GO_VERSION }}
          # The one step in this file that wants the newest toolchain rather than a stable one.
          # govulncheck derives which standard library advisories apply from the version it
          # builds with, so a pinned patch reports every stdlib finding fixed since that patch
          # shipped. The verify job pins deliberately: test results have to be reproducible, a
          # vulnerability scan has to be current.
          check-latest: true

      - name: dependencies are tidy
        run: |
          go mod tidy
          if ! git diff --exit-code go.mod go.sum; then
            echo "::error::go mod tidy changed go.mod or go.sum; commit the result"
            exit 1
          fi

      # foundation-platform is pinned to a tag, never a branch. A change to the envelope, the
      # outbox schema, or the dispatcher contract must be an upgrade this repository performs
      # deliberately rather than one it inherits from a rebuild.
      - name: foundation-platform is pinned to a released version
        run: |
          version=$(go list -m -f '{{.Version}}' github.com/anshacerbia2/foundation-platform)
          echo "foundation-platform ${version}"
          case "$version" in
            v0.0.0-*)
              echo "::error::foundation-platform resolves to a pseudo-version (${version}); pin a tag"
              exit 1
              ;;
          esac

      - name: vulnerability scan
        run: |
          go install golang.org/x/vuln/cmd/govulncheck@latest
          govulncheck ./...
