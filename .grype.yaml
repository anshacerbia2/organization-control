# Grype configuration for scripts/image-scan.sh (STD-GLB-009 1.8.0 §Container Images, which lands
# with scnehaux-architecture #86).
#
# Each ignore rule is a VEX statement about one file in one image (rule 5). It matches on the
# vulnerability, the package's name, version and type, and the full path of the file the package was
# found in: a Go module in the binary that holds it, an Alpine package in /lib/apk/db/installed. A
# new version or a moved file stops the match, and the finding comes back to be decided again. The
# reason has five parts, in order:
#
#   review-by YYYY-MM-DD: <status>: detected YYYY-MM-DD: <images>: <statement>
#
# <status> is `affected`, or `not_affected/<justification>` with a justification rule 7 accepts.
# The scan checks the form and the dates and fails once a review date has passed; whether a
# statement is true is left to review. The evidence and the decisions are in
# TDD-organization-control-001 §The Migrate Image and Its Exceptions.
check-for-app-update: false
ignore:
  # Atlas, the third-party binary the migrate image copies and does not build.
  - vulnerability: GO-2026-6888
    package:
      name: github.com/andybalholm/brotli
      version: v1.2.0
      type: go-module
      location: /usr/local/bin/atlas
    reason: >-
      review-by 2026-11-20: affected: detected 2026-11-06: the migrate image (Dockerfile target
      migrate), whose /usr/local/bin/atlas is arigaio/atlas:1.3.9: action: move the Atlas pin to the
      first release built with andybalholm/brotli v1.2.7 or later. On 2026-11-10 none exists: 1.3.9,
      published 2026-11-09, still carries v1.2.0. CVE-2026-111497, excessive memory allocation when
      decompressing a crafted stream. govulncheck v1.1.4 -mode binary on the 1.3.9 linux/amd64
      release binary (go1.26.10, revision 5314a229caa6) finds brotli.Reader.Read, so
      not_affected/vulnerable_code_not_present is not open. BOD 26-04: not publicly exposed (the
      migrate image runs once on the stack's internal network and, traced on every scan, connects to
      nothing but the database); in the KEV (added 2026-10-27, catalog 2026.11.09); Vulnrichment
      Automatable no, Technical Impact total, so 14 days from detection: by 2026-11-20. If no Atlas
      release carries the fix by then, the image runs Atlas built from source with the fixed module
      (rule 9) or the finding is raised to the owner. To be asked of Ariga by the owner (ISMS-005 T2).
      TDD-organization-control-001 §The Migrate Image and Its Exceptions.
  - vulnerability: GO-2026-6865
    package:
      name: github.com/klauspost/compress
      version: v1.18.7
      type: go-module
      location: /usr/local/bin/atlas
    reason: >-
      review-by 2027-01-05: affected: detected 2026-11-06: the migrate image (Dockerfile target
      migrate), whose /usr/local/bin/atlas is arigaio/atlas:1.3.9: action: move the Atlas pin to the
      first release built with klauspost/compress v1.20.2 or later; on 2026-11-10 1.3.9 still carries
      v1.18.7. CVE-2026-116591, a panic on two-block frames. govulncheck v1.1.4 -mode binary on the
      1.3.9 release binary finds fse.Compress and fse.Decompress, so not_affected is not open. BOD
      26-04: not publicly exposed; not in the KEV (catalog 2026.11.09); Vulnrichment Automatable yes,
      Technical Impact partial, so 60 days from detection. Asked of Ariga with GO-2026-6888 (T2).
      TDD-organization-control-001 §The Migrate Image and Its Exceptions.