# Grype configuration for scripts/image-scan.sh (STD-GLB-009 1.8.0 §Container Images, which lands
# with scnehaux-architecture #86).
#
# Each ignore rule is a VEX statement about one file in one image (rule 5). It matches on the
# vulnerability, the package's name, version and type, and the full path of the file the package was
# found in: a Go module in the binary that holds it, an Alpine package in /lib/apk/db/installed. A
# new version or a moved file stops the match, and the finding comes back to be decided again. The
# reason has five parts, in order:
#
#   review-by YYYY-MM-DD: <status>: detected YYYY-MM-DD: <images>: <statement>
#
# <status> is `affected`, or `not_affected/<justification>` with a justification rule 7 accepts.
# The scan checks the form and the dates and fails once a review date has passed; whether a
# statement is true is left to review. The evidence and the decisions are in
# TDD-organization-control-001 §The Migrate Image and Its Exceptions.
check-for-app-update: false
ignore:
  # /usr/local/bin/atlas in the migrate image: arigaio/atlas 1.3.3, built with go1.26.6,
  # golang.org/x/net v0.58.0 and google.golang.org/grpc v1.83.1. Due on 2026-12-09, the date BOD 26-04
  # would set if a statement were rejected.
  - vulnerability: GO-2026-6603
    package:
      name: stdlib
      version: go1.26.6
      type: go-module
      location: /usr/local/bin/atlas
    reason: >-
      review-by 2026-12-09: not_affected/vulnerable_code_not_in_execute_path: detected 2026-10-10:
      the migrate image (Dockerfile target migrate): HTTP/2 server code: "For HTTP/2 servers, a
      malicious client can exploit this". Atlas never listens. It runs once, as `atlas migrate apply
      --env local` from deploy/dev/migrate.sh, and scripts/atlas-execute-path.sh, run by image-scan
      on every change and daily, traces it and finds no listen(), no accept() and no inet bind().
      govulncheck v1.8.0 -mode binary finds the advisory's symbols, which it cannot tell reachable.
      TDD-organization-control-001 §The Migrate Image and Its Exceptions.
  - vulnerability: GO-2026-6605
    package:
      name: stdlib
      version: go1.26.6
      type: go-module
      location: /usr/local/bin/atlas
    reason: >-
      review-by 2026-12-09: not_affected/vulnerable_code_not_in_execute_path: detected 2026-10-10:
      the migrate image (Dockerfile target migrate): HTTP/1 client code: "When http.Transport sends
      an HTTP/1 CONNECT request with a non-empty Request.Body". Atlas's only HTTP client call is its
      release check, which ATLAS_NO_UPDATE_NOTIFIER=true in the Dockerfile turns off, with
      ATLAS_NO_ANON_TELEMETRY=true beside it. With both set its one connection is the database's,
      plaintext postgres: scripts/atlas-execute-path.sh, run by image-scan on every change and
      daily, fails on any other. Removing either ENV line voids this. govulncheck v1.8.0 -mode
      binary finds the advisory's symbols, which it cannot tell reachable.
      TDD-organization-control-001 §The Migrate Image and Its Exceptions.
