# Grype configuration for scripts/image-scan.sh (STD-GLB-009 1.8.0 §Container Images, which lands
# with scnehaux-architecture #86).
#
# Each ignore rule is a VEX statement about one file in one image (rule 5). It matches on the
# vulnerability, the package's name, version and type, and the full path of the file the package was
# found in: a Go module in the binary that holds it, an Alpine package in /lib/apk/db/installed. A
# new version or a moved file stops the match, and the finding comes back to be decided again. The
# reason has five parts, in order:
#
#   review-by YYYY-MM-DD: <status>: detected YYYY-MM-DD: <images>: <statement>
#
# <status> is `affected`, or `not_affected/<justification>` with a justification rule 7 accepts.
# The scan checks the form and the dates and fails once a review date has passed; whether a
# statement is true is left to review. The evidence and the decisions are in
# TDD-organization-control-001 §The Migrate Image and Its Exceptions.
check-for-app-update: false
ignore:
  # The Control Database, which runs the official image without building it.
  - vulnerability: CVE-2026-85091
    package:
      name: zlib
      version: 1.3.2-r0
      type: apk
      location: /lib/apk/db/installed
    reason: >-
      review-by 2026-11-16: affected: detected 2026-10-07: postgres:17.11-alpine
      (postgres@sha256:b0f9560a2de083e2cc7382e75f808c7381a32852a7ec49117deedb300e552b24), the
      Control Database in deploy/dev/compose.yaml: action: wait for the Docker Official Image
      rebuild that carries zlib 1.3.2-r1, expected with PostgreSQL 17.12, scheduled for 2026-11-12,
      then move the pin in compose and in the migrate image's base. Alpine 3.24 ships the fix; on
      2026-10-10 the tag still resolved to the pinned digest. BOD 26-04: not publicly exposed, not
      in the KEV, and in CISA's Vulnrichment Automatable no, Technical Impact total, so fix on
      system upgrade, the next pin move, within 90 days of detection. Not asked of the upstream: the
      official images rebuild on their maintainers' schedule. The migrate image upgrades zlib in its
      Dockerfile (rule 10) and the service image has no package database, so this rule matches the
      Control Database alone. TDD-organization-control-001 §The Migrate Image and Its Exceptions.
