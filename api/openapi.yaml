openapi: 3.1.0
info:
  title: Organization Control API
  version: 1.1.0
  summary: The authority for Organizations, Tenants, Workspaces, Memberships and provider authority (SAD-004).
  description: |
    The HTTP contract of organization-control, published as a versioned artifact under ADR-GLB-010
    §5.1: "Each served API SHALL publish its specification (OpenAPI for HTTP) as a versioned
    artifact". It is hand-maintained beside `internal/httpapi/routes.go`, and
    `internal/httpapi/openapi_test.go` fails the build when a route is registered without an operation
    here, or an operation names a route that is not registered.

    **Versioning.** `info.version` is this document's version, bumped in the same commit as the code
    it describes, under ADR-GLB-006's compatibility rules: the major version for a change that breaks
    a client (a route, field, value or status removed or renamed, or a field becoming required), the
    minor version for an addition (a route, an optional field, a new value of an open set), and the
    patch version for a correction of the description alone. The repository commit pins it for a
    consumer.

    **Mux patterns.** Every operation names the Go `net/http` mux pattern that serves it in
    `x-mux-pattern`, exactly as `routes.go` writes it. Here each pattern is its own path.

    **Route classes** (`x-route-class`, TDD-organization-control-001 §Caller Authority). Who a caller
    is comes from the token and this service's own records, read for each request; never from a path,
    query or body.
    - `probe`: no authentication.
    - `anonymous`: no authentication; the one route is the invitation lookup, which reads nothing.
    - `tenant`: a Tenant administrator. A person's token with `tenant_id`, `acr` `aal2` or higher and
      `auth_time`, whose Principal holds an active Membership in that active Tenant and a tenant
      administration grant (ADR-ORG-003 §5.3). The Tenant is the token's; no path names it. Anyone
      else is answered `403`. While a provider pauses Tenant administration, a Tenant administrator's
      command is answered `503`; reads continue.
    - `provider`: provider authority in force: an emergency grant, or an approved activation of an
      eligible grant that has not ended (ADR-ORG-001 §5.11, ADR-ORG-002). `X-Administrative-Reason`
      is required, and the access is recorded with it. A Tenant administrator, a consumer, a reporter
      and an eligible holder with nothing in force are answered `403`.
    - `eligible`: the activation routes. A provider grant holder with nothing in force, or a provider
      in force; `X-Administrative-Reason` is required. An eligible holder reaches these routes and no
      other.
    - `consumer-or-provider`: a registered projection consumer acting as itself (its workload token's
      principal_id is the consumer's; no reason header), or a provider with a reason. A consumer that
      names another consumer is answered `403`.
    - `self`: a person acting for themselves alone, with no record read: `GET
      /v1/principals/{principal_id}/contexts` for the caller's own principal_id (a provider with a
      reason reads anyone's), and `POST /v1/invitations/accept` for any human token (ADR-ORG-005 §5.1,
      ADR-ORG-007 §5.1).
    - `provider-or-reporter:provisioning`: a registered reporter workload for `provisioning`
      (subject_type `workload`; `X-Administrative-Reason` optional), or a provider (reason required)
      reporting on the system's behalf.
    - `reporter:obligation`: a registered reporter workload for `obligation:<domain>`, and only for an
      obligation raised against that domain; the body's `domain` must be the reporter's. Anyone else,
      a provider included, is answered `403`.

    **Commands** (STD-GLB-001 §Commands Require an Idempotency-Key, TDD-organization-control-003
    §The Idempotency-Key Is Required on Commands). Every POST is classified in
    `internal/httpapi/commands.go`: a command without an `Idempotency-Key` is answered `400`; a
    key-optional route honours one that is sent. A retry with the same key, method, path and body
    answers the first answer, with `Idempotent-Replay: true`; the same key with a different request
    is `409` `idempotency-key-conflict`, and one still running is `409` `request-in-progress`. A
    refusal is not recorded, so a corrected retry with the same key runs. A key on a GET is answered
    `400`. Completed keys are kept 7 days and then purged; a retry after that runs as a new command.

    **Reasons.** `X-Administrative-Reason` must be visible US-ASCII (RFC 9110 §5.5); other octets are
    answered `400` on every route. It is cut at 1000 characters.

    **Lists** take `after`, the last identifier of the previous page, and `limit`, 1 to 100 (50 when
    absent), and answer `next`, null on the last page (STD-GLB-001 §Pagination). An unknown or
    repeated query parameter is answered `400`.

    **Bodies** are one JSON document of at most 64 KiB. An unknown field is answered `400`.

    **Errors** are RFC 9457 problem details from foundation-platform's closed registry. A client
    branches on `type`, never on `detail`.
  contact:
    name: Core Platform Team
  license:
    name: Proprietary
    identifier: LicenseRef-Scnehaux-Proprietary
servers:
  - url: http://127.0.0.1:8099
    description: The development loopback port `make run` serves on (README.md).
security:
  - bearer: []
tags:
  - name: probes
    description: "Liveness and readiness, unauthenticated."
  - name: memberships
    description: "A Tenant's Memberships (TDD-organization-control-002)."
  - name: membership-batches
    description: "Bulk Membership actions, previewed and then executed (ADR-ORG-004)."
  - name: workspaces
    description: "A Tenant's Workspaces."
  - name: invitations
    description: "Invitations, their lookup and their acceptance (TDD-organization-control-004, ADR-ORG-007)."
  - name: organizations
    description: "The Organization registry."
  - name: tenants
    description: "Tenant lifecycle (TDD-organization-control-003)."
  - name: tenant-administrators
    description: "Who administers a Tenant (ADR-ORG-003)."
  - name: provisioning
    description: "The provisioning correlation surface (TDD-organization-control-003)."
  - name: offboardings
    description: "Tenant offboarding and its obligations (TDD-organization-control-004)."
  - name: provider-grants
    description: "Provider authority grants (ADR-ORG-001 §5.11, ADR-ORG-002 §5.2)."
  - name: provider-activations
    description: "Provider activations of eligible grants (ADR-ORG-002)."
  - name: privileged-access
    description: "The privileged-access record and its review (ADR-ORG-002 §5.6)."
  - name: projections
    description: "The consumer registry, snapshots, the frontier and reconciliation (TDD-organization-control-002)."
  - name: dead-letters
    description: "Dead-lettered deliveries: replay, resolution and waiver (TDD-organization-control-005)."
  - name: contexts
    description: "Operating contexts and the authoritative fresh check."
  - name: recovery
    description: "Recovery after a restore to an older point (TDD-organization-control-001, -002)."
  - name: reporters
    description: "Registered reporter workloads: the provisioning system and the domains owning offboarding obligations."
paths:
  "/healthz":
    get:
      operationId: liveness
      summary: Liveness. Touches no dependency.
      tags: [probes]
      x-route-class: probe
      x-mux-pattern: "GET /healthz"
      security: []
      responses:
        "200":
          description: The process serves.
          content:
            text/plain:
              schema:
                type: string
                const: "ok\n"
  "/readyz":
    get:
      operationId: readiness
      summary: Readiness. Answers whether the control database is reachable.
      tags: [probes]
      x-route-class: probe
      x-mux-pattern: "GET /readyz"
      security: []
      responses:
        "200":
          description: The replica can serve.
          content:
            text/plain:
              schema:
                type: string
                const: "ready\n"
        "503":
          $ref: "#/components/responses/Unavailable"

  "/v1/memberships":
    get:
      operationId: listMemberships
      summary: List the Tenant's Memberships.
      tags: [memberships]
      x-route-class: tenant
      x-mux-pattern: "GET /v1/memberships"
      parameters:
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/MembershipStatus"
        - name: workspace_id
          in: query
          schema:
            $ref: "#/components/schemas/UUID"
        - name: principal_id
          in: query
          schema:
            $ref: "#/components/schemas/UUID"
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [memberships, next]
                properties:
                  memberships:
                    type: array
                    items:
                      $ref: "#/components/schemas/Membership"
                  next:
                    $ref: "#/components/schemas/Next"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: grantMembership
      summary: Grant a Membership in the Tenant.
      tags: [memberships]
      x-route-class: tenant
      x-mux-pattern: "POST /v1/memberships"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [principal_id, subject_type, provenance, valid_from]
              properties:
                principal_id:
                  $ref: "#/components/schemas/UUID"
                workspace_id:
                  $ref: "#/components/schemas/UUID"
                subject_type:
                  $ref: "#/components/schemas/SubjectType"
                provenance:
                  type: string
                  minLength: 1
                  description: How the Membership came to exist (PAD-PLT-002 §3.2).
                valid_from:
                  $ref: "#/components/schemas/Timestamp"
                valid_until:
                  $ref: "#/components/schemas/Timestamp"
      responses:
        "201":
          $ref: "#/components/responses/MembershipResultAnswer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/memberships/{membership_id}":
    get:
      operationId: getMembership
      summary: Read one Membership.
      tags: [memberships]
      x-route-class: tenant
      x-mux-pattern: "GET /v1/memberships/{membership_id}"
      parameters:
        - $ref: "#/components/parameters/MembershipID"
      responses:
        "200":
          description: The Membership.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Membership"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/memberships/{membership_id}/suspend":
    post:
      operationId: suspendMembership
      summary: Suspend a Membership.
      description: The reason is recorded when sent.
      tags: [memberships]
      x-route-class: tenant
      x-mux-pattern: "POST /v1/memberships/{membership_id}/suspend"
      parameters:
        - $ref: "#/components/parameters/MembershipID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AdministrativeReasonOptional"
      requestBody:
        $ref: "#/components/requestBodies/ExpectedVersion"
      responses:
        "200":
          $ref: "#/components/responses/MembershipResultAnswer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/memberships/{membership_id}/restore":
    post:
      operationId: restoreMembership
      summary: Restore a suspended Membership.
      description: The reason is recorded when sent.
      tags: [memberships]
      x-route-class: tenant
      x-mux-pattern: "POST /v1/memberships/{membership_id}/restore"
      parameters:
        - $ref: "#/components/parameters/MembershipID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AdministrativeReasonOptional"
      requestBody:
        $ref: "#/components/requestBodies/ExpectedVersion"
      responses:
        "200":
          $ref: "#/components/responses/MembershipResultAnswer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/memberships/{membership_id}/revoke":
    post:
      operationId: revokeMembership
      summary: Revoke a Membership. Irreversible, so a reason is required.
      tags: [memberships]
      x-route-class: tenant
      x-mux-pattern: "POST /v1/memberships/{membership_id}/revoke"
      parameters:
        - $ref: "#/components/parameters/MembershipID"
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AdministrativeReason"
      requestBody:
        $ref: "#/components/requestBodies/ExpectedVersion"
      responses:
        "200":
          $ref: "#/components/responses/MembershipResultAnswer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/memberships/{membership_id}/enforcement":
    get:
      operationId: getMembershipEnforcement
      summary: The enforcement evidence for a Membership's latest transition (TDD-organization-control-002).
      tags: [memberships]
      x-route-class: tenant
      x-mux-pattern: "GET /v1/memberships/{membership_id}/enforcement"
      parameters:
        - $ref: "#/components/parameters/MembershipID"
      responses:
        "200":
          $ref: "#/components/responses/EnforcementAnswer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"

  "/v1/membership-batches":
    post:
      operationId: previewMembershipBatch
      summary: Preview a bulk action on Memberships (ADR-ORG-004 §5.1).
      description: A revocation batch requires X-Administrative-Reason; the reason is recorded for the others when sent.
      tags: [membership-batches]
      x-route-class: tenant
      x-mux-pattern: "POST /v1/membership-batches"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
        - $ref: "#/components/parameters/AdministrativeReasonOptional"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [action, membership_ids]
              properties:
                action:
                  type: string
                  enum: [suspend, restore, revoke]
                membership_ids:
                  type: array
                  minItems: 1
                  maxItems: 500
                  items:
                    $ref: "#/components/schemas/UUID"
                continues:
                  $ref: "#/components/schemas/UUID"
      responses:
        "201":
          $ref: "#/components/responses/BatchAnswer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "413":
          $ref: "#/components/responses/PayloadTooLarge"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/membership-batches/{batch_id}":
    get:
      operationId: getMembershipBatch
      summary: Read a batch and its items.
      tags: [membership-batches]
      x-route-class: tenant
      x-mux-pattern: "GET /v1/membership-batches/{batch_id}"
      parameters:
        - $ref: "#/components/parameters/BatchID"
      responses:
        "200":
          $ref: "#/components/responses/BatchAnswer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/membership-batches/{batch_id}/execute":
    post:
      operationId: executeMembershipBatch
      summary: Execute a previewed batch, or resume one left executing.
      description: The body is optional; absent, every item is attempted. 200 whatever the items' outcomes, which the body carries one by one.
      tags: [membership-batches]
      x-route-class: tenant
      x-mux-pattern: "POST /v1/membership-batches/{batch_id}/execute"
      parameters:
        - $ref: "#/components/parameters/BatchID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              properties:
                fail_on_errors:
                  type: [integer, "null"]
                  minimum: 0
                  description: Stop attempting items once this many have failed; null or absent attempts every item.
      responses:
        "200":
          $ref: "#/components/responses/BatchAnswer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"

  "/v1/workspaces":
    get:
      operationId: listWorkspaces
      summary: List the Tenant's Workspaces.
      tags: [workspaces]
      x-route-class: tenant
      x-mux-pattern: "GET /v1/workspaces"
      parameters:
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/Limit"
        - name: status
          in: query
          schema:
            $ref: "#/components/schemas/WorkspaceStatus"
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [workspaces, next]
                properties:
                  workspaces:
                    type: array
                    items:
                      $ref: "#/components/schemas/Workspace"
                  next:
                    $ref: "#/components/schemas/Next"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: createWorkspace
      summary: Create a Workspace in the Tenant.
      tags: [workspaces]
      x-route-class: tenant
      x-mux-pattern: "POST /v1/workspaces"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [display_name, type]
              properties:
                display_name:
                  type: string
                type:
                  type: string
      responses:
        "201":
          $ref: "#/components/responses/WorkspaceAnswer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/workspaces/{workspace_id}":
    get:
      operationId: getWorkspace
      summary: Read one Workspace.
      tags: [workspaces]
      x-route-class: tenant
      x-mux-pattern: "GET /v1/workspaces/{workspace_id}"
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceAnswer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/workspaces/{workspace_id}/archive":
    post:
      operationId: archiveWorkspace
      summary: Archive a Workspace.
      tags: [workspaces]
      x-route-class: tenant
      x-mux-pattern: "POST /v1/workspaces/{workspace_id}/archive"
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/ExpectedVersion"
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceAnswer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/workspaces/{workspace_id}/restore":
    post:
      operationId: restoreWorkspace
      summary: Restore an archived Workspace.
      tags: [workspaces]
      x-route-class: tenant
      x-mux-pattern: "POST /v1/workspaces/{workspace_id}/restore"
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/ExpectedVersion"
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceAnswer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
  "/v1/workspaces/{workspace_id}/retire":
    post:
      operationId: retireWorkspace
      summary: Retire a Workspace. Refused 412 while Memberships are present.
      tags: [workspaces]
      x-route-class: tenant
      x-mux-pattern: "POST /v1/workspaces/{workspace_id}/retire"
      parameters:
        - $ref: "#/components/parameters/WorkspaceID"
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        $ref: "#/components/requestBodies/ExpectedVersion"
      responses:
        "200":
          $ref: "#/components/responses/WorkspaceAnswer"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "404":
          $ref: "#/components/responses/NotFound"
        "409":
          $ref: "#/components/responses/Conflict"
        "412":
          $ref: "#/components/responses/PreconditionFailed"
        "503":
          $ref: "#/components/responses/Unavailable"

  "/v1/invitations":
    get:
      operationId: listInvitations
      summary: List the Tenant's invitations. No item carries the invited address or its hash.
      tags: [invitations]
      x-route-class: tenant
      x-mux-pattern: "GET /v1/invitations"
      parameters:
        - $ref: "#/components/parameters/After"
        - $ref: "#/components/parameters/Limit"
        - name: state
          in: query
          schema:
            $ref: "#/components/schemas/InvitationState"
      responses:
        "200":
          description: One page.
          content:
            application/json:
              schema:
                type: object
                required: [invitations, next]
                properties:
                  invitations:
                    type: array
                    items:
                      $ref: "#/components/schemas/Invitation"
                  next:
                    $ref: "#/components/schemas/Next"
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "503":
          $ref: "#/components/responses/Unavailable"
    post:
      operationId: issueInvitation
      summary: Issue an invitation. The live answer carries its token, once.
      description: |
        The token is never stored, only its hash, so it is answered live only. A replay with the same
        Idempotency-Key answers the invitation without `token`; a caller that lost it revokes and
        issues again.
      tags: [invitations]
      x-route-class: tenant
      x-mux-pattern: "POST /v1/invitations"
      parameters:
        - $ref: "#/components/parameters/IdempotencyKey"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              additionalProperties: false
              required: [target_identifier, subject_type]
              properties:
                target_identifier:
                  type: string
                  minLength: 1
                  description: The invited address. Tier-2 PII (STD-GLB-007); never answered back.
                workspace_id:
                  $ref: "#/components/schemas/UUID"
                subject_type:
                  $ref: "#/components/schemas/SubjectType"
                reason:
                  type: string
                ttl_seconds:
                  type: integer
                  format: int64
                  minimum: 0
                  maximum: 2592000
                  description: Seconds until it expires; absent or 0 is 7 days, at most 30 days.
      responses:
        "201":
          description: The invitation, and its token on the live answer.
          content:
            application/json:
              schema:
                type: object
                required: [invitation]
                properties:
                  invitation:
                    $ref: "#/components/schemas/Invitation"
                  token:
                    type: string
                    description: The invitation token. On the live answer only; a replay omits it.
        "400":
          $ref: "#/components/responses/BadRequest"
        "401":
          $ref: "#/components/responses/Unauthorized"
        "403":
          $ref: "#/components/responses/Forbidden"
        "409":
          $ref: "#/components/responses/Conflict"
        "503":
          $ref: "#/components/responses/Unavailable"
