  "/v1/invitations/lookup":
    post:
      operationId: lookupInvitation
      summary: Check a token's shape. Answers the same for every well-formed token.
      description: |
        Reads no record (SAD-004 §5.5): an absent, expired, revoked, accepted and valid token are
        answered alike. A malformed token is answered 400.
      tags: [invitations]
      x-route-class: anonymous
      x-mux-pattern: "POST /v1/invitations/lookup"
      security: []
      requestBody:
        $ref: "#/components/requestBodies/InvitationToken"
      responses:
        "200":
          description: The token is well formed; sign in and accept.
          content:
            application/json:
              schema:
                type: object
                required: [accepted, next]
                properties:
                  accepted:
                    type: boolean
                    const: true
                    description: The token is well formed. Not a statement that the invitation exists.
                  next:
                    type: string
                    const: accept
        "400":
          $ref: "#/components/responses/BadRequest"
  "/v1/invitations/accept":
    post:
      operationId: acceptInvitation
      summary: Accept an invitation as the invited person, signed in as themselves (ADR-ORG-007).
      description: |
        Any human token, with or without `tenant_id`; a workload is answered 403. The caller must hold
        the invited address as a proven address at the Identity Control API. The Membership created is
        the caller's own. Every failed lookup and an address mismatch answer one 404 of type
        `invitation-not-acceptable`, with a constant detail; a client branches on `type`. A Tenant that
        is not active, or an existing Membership, is 409; the Identity Control API unreachable is 503.
      tags: [invitations]
      x-route-class: self
      x-mux-pattern: "POST /v1/invitations/accept"
      parameters:
