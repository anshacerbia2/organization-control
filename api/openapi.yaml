components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A person's access token, typed at+jwt (RFC 9068), naming organization-control-api in aud and
        carrying principal_id and subject_type human (STD-IAM-002 §3.2). With tenant_id it must carry
        acr aal2 or higher and auth_time, and is a Tenant administrator's for that Tenant; without, it
        carries acr and auth_time and is a provider's or an eligible holder's by this service's
        provider grants, or a self caller's on the two self routes.
    workloadBearer:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: |
        A workload's access token: subject_type workload, workload_owner, and no tenant_id. Admitted as
        the registered projection consumer, or the registered reporter, its principal_id names.

  parameters:
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: true
      description: A value unique to this command, sent again unchanged when it is retried. Without it the command is answered 400.
      schema:
        type: string
        minLength: 1
    IdempotencyKeyOptional:
      name: Idempotency-Key
      in: header
      required: false
      description: Honoured, not required; commands.go keyOptional names the reason.
      schema:
        type: string
        minLength: 1
    AdministrativeReason:
      name: X-Administrative-Reason
      in: header
      required: true
      description: Why, recorded with the action and the access. Visible US-ASCII (RFC 9110 §5.5); cut at 1000 characters.
      schema:
        type: string
        minLength: 1
        pattern: "^[\\t\\x20-\\x7e]+$"
    AdministrativeReasonOptional:
      name: X-Administrative-Reason
      in: header
      required: false
      description: |
        Visible US-ASCII (RFC 9110 §5.5). Required from a provider on a route a consumer, a reporter or
        a self caller also reaches; on a Tenant administrator's route it is recorded when sent, and
        required for a revocation.
      schema:
        type: string
        pattern: "^[\\t\\x20-\\x7e]+$"
    After:
      name: after
      in: query
      description: The last identifier of the previous page; absent starts at the first item.
      schema:
        $ref: "#/components/schemas/UUID"
    Limit:
      name: limit
      in: query
      description: The page size; absent is 50.
      schema:
        type: integer
        minimum: 1
        maximum: 100
    AuthorityFilter:
      name: authority
      in: query
      description: The authority the access was made under.
      schema:
        type: string
        enum: [emergency, activation, eligible]
    From:
      name: from
      in: query
      description: The window's start, inclusive; an RFC 3339 instant with its offset.
      schema:
        $ref: "#/components/schemas/Timestamp"
    To:
      name: to
      in: query
      description: The window's end, exclusive; an RFC 3339 instant with its offset.
      schema:
        $ref: "#/components/schemas/Timestamp"
    MembershipID:
      name: membership_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    BatchID:
      name: batch_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    WorkspaceID:
      name: workspace_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    InvitationID:
      name: invitation_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    OrganizationID:
      name: organization_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    TenantID:
      name: tenant_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    GrantID:
      name: grant_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    OffboardingID:
      name: offboarding_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    ObligationID:
      name: obligation_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    ActivationID:
      name: activation_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    ConsumerID:
      name: consumer_id
      in: path
      required: true
      description: The registered consumer's identifier.
      schema:
        type: string
    EventID:
      name: event_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    DeadLetterConsumer:
      name: consumer
      in: path
      required: true
      description: The consumer the delivery was dead-lettered at; a dead letter is keyed (event_id, consumer).
      schema:
        type: string
    PrincipalID:
      name: principal_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"
    ReporterID:
      name: reporter_id
      in: path
      required: true
      schema:
        $ref: "#/components/schemas/UUID"

  requestBodies:
    ExpectedVersion:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [expected_version]
            properties:
              expected_version:
                type: integer
                format: int64
                minimum: 1
                description: The record's version, as the caller was shown it; another is answered 409 version-conflict.
    TenantExpectedVersion:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [expected_version]
            properties:
              expected_version:
                type: integer
                format: int64
                minimum: 1
                description: The Tenant's version, as the caller was shown it.
    BatchSize:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              size:
                type: integer
                minimum: 0
                description: How many rows one call handles; 0 or absent takes the service's default.
    InvitationToken:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [token]
            properties:
              token:
                type: string
    PrincipalReference:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [principal_id]
            properties:
              principal_id:
                $ref: "#/components/schemas/UUID"
    ProvisioningOutcome:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [correlation_id]
            properties:
              correlation_id:
                $ref: "#/components/schemas/UUID"
              detail:
                type: string
    Snapshot:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            properties:
              consumer_id:
                type: string
                description: The consumer the snapshot is for. A consumer may name only itself.
              page_size:
                type: integer
                minimum: 1
                maximum: 5000
                description: Absent is 1000.
              cursor:
                type: string
                description: The previous page's cursor; absent on the first page.
              mark:
                type: integer
                format: int64
                description: The snapshot's high_water_mark, sent with each continuation.
    ConsumerReport:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [consumer_id, mark, rows]
            properties:
              consumer_id:
                type: string
              mark:
                type: integer
                format: int64
                description: The position the reported state corresponds to.
              rows:
                type: array
                items:
                  type: object
                  additionalProperties: false
                  required: [membership_id, membership_version]
                  properties:
                    membership_id:
                      $ref: "#/components/schemas/UUID"
                    membership_version:
                      type: integer
                      format: int64
    ContextCheck:
      required: true
      content:
        application/json:
          schema:
            type: object
            additionalProperties: false
            required: [tenant_id, principal_id]
            properties:
              consumer_id:
                type: string
                description: A provider names the consumer it checks for; a consumer is itself and may omit it.
              tenant_id:
                $ref: "#/components/schemas/UUID"
              principal_id:
                $ref: "#/components/schemas/UUID"

  responses:
    BadRequest:
      description: The request is invalid, a command carries no Idempotency-Key, or a required X-Administrative-Reason is missing.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unauthorized:
      description: No bearer token, or one that was not accepted.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Forbidden:
      description: The token's claims confer no scope, or the caller's route class does not admit it.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    NotFound:
      description: No such record, or one the caller may not see.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    InvitationNotAcceptable:
      description: The invitation cannot be accepted. One answer, with a constant detail, for every failure.
      content:
        application/problem+json:
          schema:
            allOf:
              - $ref: "#/components/schemas/Problem"
              - type: object
                properties:
                  type:
                    const: https://problems.scnehaux.com/invitation-not-acceptable
                  title:
                    const: The invitation cannot be accepted
    Conflict:
      description: A refused transition, a version conflict, an idempotency key conflict, or a request in progress.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PreconditionFailed:
      description: The request is well formed and another record does not allow it yet.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    PayloadTooLarge:
      description: More items than a batch carries; the detail names the limit (RFC 7644 §3.7.4).
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    Unavailable:
      description: A dependency is unavailable, or Tenant administration is paused for a Tenant administrator's command; send the same request again later.
      content:
        application/problem+json:
          schema:
            $ref: "#/components/schemas/Problem"
    MembershipResultAnswer:
      description: The Membership as it now stands, and the event the transition published.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MembershipResult"
    EnforcementAnswer:
      description: The evidence for the Membership's latest transition.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Enforcement"
    BatchAnswer:
      description: The batch and each item.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/MembershipBatch"
    WorkspaceAnswer:
      description: The Workspace.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Workspace"
    InvitationAnswer:
      description: The invitation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Invitation"
    AffectedAnswer:
      description: How many rows the batch changed.
      content:
        application/json:
          schema:
            type: object
            required: [affected]
            properties:
              affected:
                type: integer
    OrganizationAnswer:
      description: The Organization.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Organization"
    TenantResultAnswer:
      description: The Tenant as it now stands.
      content:
        application/json:
          schema:
            type: object
            required: [tenant, accepted_at, published]
            properties:
              tenant:
                $ref: "#/components/schemas/TenantSummary"
              accepted_at:
                $ref: "#/components/schemas/Timestamp"
              published:
                type: boolean
                description: Whether the lifecycle event was written in the same transaction.
    ProvisioningResolutionAnswer:
      description: The outcome as recorded.
      content:
        application/json:
          schema:
            type: object
            required: [provisioning_request_id, tenant_id, state, tenant, replay, resolved_at]
            properties:
              provisioning_request_id:
                $ref: "#/components/schemas/UUID"
              tenant_id:
                $ref: "#/components/schemas/UUID"
              state:
                $ref: "#/components/schemas/ProvisioningState"
              tenant:
                $ref: "#/components/schemas/TenantSummary"
              replay:
                type: boolean
                description: The outcome was already recorded and this call changed nothing.
              resolved_at:
                $ref: "#/components/schemas/Timestamp"
    OffboardingAnswer:
      description: The offboarding.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Offboarding"
    ObligationAnswer:
      description: The obligation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Obligation"
    ProviderGrantAnswer:
      description: The grant.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProviderGrant"
    AccessPageAnswer:
      description: One page of the privileged-access record.
      content:
        application/json:
          schema:
            type: object
            required: [accesses, next]
            properties:
              accesses:
                type: array
                items:
                  $ref: "#/components/schemas/PrivilegedAccess"
              next:
                $ref: "#/components/schemas/Next"
    ProviderActivationAnswer:
      description: The activation.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ProviderActivation"
    ConsumerAnswer:
      description: The consumer.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Consumer"
    PauseAnswer:
      description: The latest pause decision.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Pause"
    DecisionAnswer:
      description: The authoritative answer; a refusal is a complete answer, not an error.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Decision"
    ReporterAnswer:
      description: The reporter.
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/Reporter"

  schemas:
    UUID:
      type: string
      format: uuid
    Timestamp:
      type: string
      format: date-time
    NullableTimestamp:
      type: [string, "null"]
      format: date-time
    NullableUUID:
      type: [string, "null"]
      format: uuid
    NullableString:
      type: [string, "null"]
    Next:
      type: [string, "null"]
      description: The cursor for the next page, passed as `after`; null on the last page.
    Problem:
      type: object
      description: RFC 9457 problem details, from foundation-platform's closed registry.
      required: [type, title, status, instance]
      properties:
        type:
          type: string
          format: uri
          enum:
            - https://problems.scnehaux.com/validation-failed
            - https://problems.scnehaux.com/authentication-required
            - https://problems.scnehaux.com/forbidden
            - https://problems.scnehaux.com/not-found
            - https://problems.scnehaux.com/invitation-not-acceptable
            - https://problems.scnehaux.com/version-conflict
            - https://problems.scnehaux.com/idempotency-key-conflict
            - https://problems.scnehaux.com/state-transition-refused
            - https://problems.scnehaux.com/request-in-progress
            - https://problems.scnehaux.com/precondition-unmet
            - https://problems.scnehaux.com/payload-too-large
            - https://problems.scnehaux.com/rate-limited
            - https://problems.scnehaux.com/overloaded
            - https://problems.scnehaux.com/dependency-unavailable
            - https://problems.scnehaux.com/internal
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
          description: For a person to read. A client never parses it.
        instance:
          type: string
        correlation_id:
          type: string

    SubjectType:
      type: string
      enum: [human, workload]
    MembershipStatus:
      type: string
      enum: [active, suspended, revoked]
    WorkspaceStatus:
      type: string
      enum: [active, archived, retired]
    InvitationState:
      type: string
      enum: [pending, accepted, expired, revoked]
    OrganizationClassification:
      type: string
      enum: [provider, customer, partner, publisher]
    TenantStatus:
      type: string
      enum: [requested, provisioning, active, failed, suspended, offboarding, retired]
    IsolationProfile:
      type: string
      enum: [pooled, bridge, silo, regional]
    ProvisioningState:
      type: string
      enum: [requested, realized, failed, unresolved]
    OffboardingStage:
      type: string
      enum: [freeze, obligations, release, retired, cancelled]
    StaleBehavior:
      type: string
      enum: [use_with_marker, revalidate, fail_closed]
    ProviderScope:
      type: string
      enum: [provider:organization-control, provider:identity-control]
    ReporterReports:
      type: string
      pattern: "^(provisioning|obligation:[a-z0-9-]{1,63})$"
      description: What the reporter reports. `provisioning`, or `obligation:<domain>` for one domain's obligations.

    Membership:
      type: object
      required: [membership_id, principal_id, tenant_id, workspace_id, subject_type, status, version, valid_from, valid_until, provenance]
      properties:
        membership_id:
          $ref: "#/components/schemas/UUID"
        principal_id:
          $ref: "#/components/schemas/UUID"
        tenant_id:
          $ref: "#/components/schemas/UUID"
        workspace_id:
          $ref: "#/components/schemas/UUID"
        subject_type:
          $ref: "#/components/schemas/SubjectType"
        status:
          $ref: "#/components/schemas/MembershipStatus"
        version:
          type: integer
          format: int64
        valid_from:
          $ref: "#/components/schemas/Timestamp"
        valid_until:
          $ref: "#/components/schemas/Timestamp"
        provenance:
          type: string
    MembershipResult:
      type: object
      required: [membership, accepted_at, tenant_security_version, event_id]
      properties:
        membership:
          $ref: "#/components/schemas/Membership"
        accepted_at:
          $ref: "#/components/schemas/Timestamp"
        tenant_security_version:
          type: integer
          format: int64
        event_id:
          $ref: "#/components/schemas/UUID"
    Enforcement:
      type: object
      required: [membership_id, event_id, transition, accepted_at, published_at, budget_seconds, consumers, state, evaluated_at]
      properties:
        membership_id:
          $ref: "#/components/schemas/UUID"
        event_id:
          $ref: "#/components/schemas/UUID"
        transition:
          type: string
          enum: [grant, suspend, restore, revoke]
        accepted_at:
          $ref: "#/components/schemas/Timestamp"
        published_at:
          $ref: "#/components/schemas/NullableTimestamp"
        budget_seconds:
          type: integer
        consumers:
          type: array
          items:
            type: object
            required: [consumer_id, evidence, recorded_at]
            properties:
              consumer_id:
                type: string
              evidence:
                type: string
                enum: [consumer_applied, transport_accepted, pending, dead_lettered]
              recorded_at:
                $ref: "#/components/schemas/NullableTimestamp"
        state:
          type: string
          enum: [accepted, propagating, enforced, over_budget]
        evaluated_at:
          $ref: "#/components/schemas/Timestamp"
    BatchProblem:
      type: [object, "null"]
      description: The problem the single command would answer for the item.
      required: [type, title, status]
      properties:
        type:
          type: string
        title:
          type: string
        status:
          type: integer
        detail:
          type: string
    MembershipBatch:
      type: object
      required: [batch_id, action, state, reason, correlation_id, continues, created_by, created_at, expires_at, executed_at, completed_at, fail_on_errors, heartbeat_at, resumed_by, resumed_at, counts, items]
      properties:
        batch_id:
          $ref: "#/components/schemas/UUID"
        action:
          type: string
          enum: [suspend, restore, revoke]
        state:
          type: string
          enum: [previewed, executing, executed, expired]
        reason:
          $ref: "#/components/schemas/NullableString"
        correlation_id:
          $ref: "#/components/schemas/UUID"
        continues:
          $ref: "#/components/schemas/NullableUUID"
        created_by:
          $ref: "#/components/schemas/UUID"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        executed_at:
          $ref: "#/components/schemas/NullableTimestamp"
        completed_at:
          $ref: "#/components/schemas/NullableTimestamp"
        fail_on_errors:
          type: [integer, "null"]
        heartbeat_at:
          $ref: "#/components/schemas/NullableTimestamp"
        resumed_by:
          $ref: "#/components/schemas/NullableUUID"
        resumed_at:
          $ref: "#/components/schemas/NullableTimestamp"
        counts:
          type: object
          required: [would_change, would_not_change, succeeded, failed, not_attempted]
          properties:
            would_change:
              type: integer
            would_not_change:
              type: integer
            succeeded:
              type: integer
            failed:
              type: integer
            not_attempted:
              type: integer
        items:
          type: array
          items:
            type: object
            required: [membership_id, principal_id, current_status, version, resulting_status, refusal, outcome]
            properties:
              membership_id:
                $ref: "#/components/schemas/UUID"
              principal_id:
                $ref: "#/components/schemas/NullableUUID"
              current_status:
                $ref: "#/components/schemas/NullableString"
              version:
                type: [integer, "null"]
                format: int64
              resulting_status:
                $ref: "#/components/schemas/NullableString"
              refusal:
                $ref: "#/components/schemas/BatchProblem"
              outcome:
                type: [object, "null"]
                description: Null until the batch executed; carries only the fields its status has.
                required: [status]
                properties:
                  status:
                    type: string
                    enum: [succeeded, failed, not_attempted]
                  accepted_at:
                    $ref: "#/components/schemas/Timestamp"
                  event_id:
                    $ref: "#/components/schemas/UUID"
                  version:
                    type: integer
                    format: int64
                  problem:
                    $ref: "#/components/schemas/BatchProblem"
                  reason:
                    type: string
                    enum: [refused_at_preview, error_allowance, expired]
    Workspace:
      type: object
      required: [workspace_id, tenant_id, display_name, type, status, version, created_at]
      properties:
        workspace_id:
          $ref: "#/components/schemas/UUID"
        tenant_id:
          $ref: "#/components/schemas/UUID"
        display_name:
          type: string
        type:
          type: string
        status:
          $ref: "#/components/schemas/WorkspaceStatus"
        version:
          type: integer
          format: int64
        created_at:
          $ref: "#/components/schemas/Timestamp"
    Invitation:
      type: object
      description: Carries neither the invited address nor its hash.
      required: [invitation_id, tenant_id, subject_type, invited_by, state, correlation_id, expires_at, created_at]
      properties:
        invitation_id:
          $ref: "#/components/schemas/UUID"
        tenant_id:
          $ref: "#/components/schemas/UUID"
        workspace_id:
          $ref: "#/components/schemas/UUID"
        subject_type:
          $ref: "#/components/schemas/SubjectType"
        invited_by:
          $ref: "#/components/schemas/UUID"
        reason:
          type: string
        state:
          $ref: "#/components/schemas/InvitationState"
        correlation_id:
          $ref: "#/components/schemas/UUID"
        principal_id:
          $ref: "#/components/schemas/UUID"
        expires_at:
          $ref: "#/components/schemas/Timestamp"
        created_at:
          $ref: "#/components/schemas/Timestamp"
        accepted_at:
          $ref: "#/components/schemas/Timestamp"
        revoked_at:
          $ref: "#/components/schemas/Timestamp"
    Organization:
      type: object
      required: [organization_id, display_name, classification, status, version, created_at]
      properties:
        organization_id:
          $ref: "#/components/schemas/UUID"
        display_name:
          type: string
        classification:
          $ref: "#/components/schemas/OrganizationClassification"
        status:
          type: string
          enum: [active, suspended, retired]
        parent_id:
          $ref: "#/components/schemas/UUID"
        version:
          type: integer
          format: int64
        created_at:
          $ref: "#/components/schemas/Timestamp"
    TenantSummary:
      type: object
      required: [tenant_id, organization_id, status, version, security_version]
      properties:
        tenant_id:
          $ref: "#/components/schemas/UUID"
        organization_id:
          $ref: "#/components/schemas/UUID"
        status:
          $ref: "#/components/schemas/TenantStatus"
        version:
          type: integer
          format: int64
        security_version:
          type: integer
          format: int64
    TenantRecord:
      type: object
      description: The lifecycle stamps are absent until reached.
      required: [tenant_id, organization_id, display_name, status, isolation_profile, version, security_version, created_at]
      properties:
        tenant_id:
          $ref: "#/components/schemas/UUID"
        organization_id:
          $ref: "#/components/schemas/UUID"
        display_name:
          type: string
        status:
          $ref: "#/components/schemas/TenantStatus"
        isolation_profile:
          $ref: "#/components/schemas/IsolationProfile"
        residency_region:
          type: string
        version:
          type: integer
          format: int64
        security_version:
          type: integer
          format: int64
        activated_at:
          $ref: "#/components/schemas/Timestamp"
        suspended_at:
          $ref: "#/components/schemas/Timestamp"
        offboarding_started_at:
          $ref: "#/components/schemas/Timestamp"
        retired_at:
          $ref: "#/components/schemas/Timestamp"
        created_at:
          $ref: "#/components/schemas/Timestamp"
    TenantDetail:
      allOf:
        - $ref: "#/components/schemas/TenantRecord"
        - type: object
          required: [offboarding_id, active_memberships, provisioning]
          properties:
            offboarding_id:
              $ref: "#/components/schemas/NullableUUID"
            active_memberships:
              type: integer
            provisioning:
              type: [object, "null"]
              description: The latest provisioning request, or null when there is none.
              required: [request_id, correlation_id, state, detail, requested_at, resolved_at]
              properties:
                request_id:
                  $ref: "#/components/schemas/UUID"
                correlation_id:
                  $ref: "#/components/schemas/UUID"
                state:
                  $ref: "#/components/schemas/ProvisioningState"
                detail:
                  $ref: "#/components/schemas/NullableString"
                requested_at:
                  $ref: "#/components/schemas/Timestamp"
                resolved_at:
                  $ref: "#/components/schemas/NullableTimestamp"
    TenantAdministrationGrant:
      type: object
      required: [grant_id, tenant_id, principal_id, granted_by, reason, granted_at, active, revoked_at, revoked_by]
      properties:
        grant_id:
          $ref: "#/components/schemas/UUID"
        tenant_id:
          $ref: "#/components/schemas/UUID"
        principal_id:
          $ref: "#/components/schemas/UUID"
        granted_by:
