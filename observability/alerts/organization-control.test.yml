# promtool test rules observability/alerts/organization-control.test.yml
#
# Each alert is shown firing on a value past its threshold and silent on one below it, so a rule
# that can never fire, or always fires, fails here.

rule_files:
  - organization-control.rules.yml

evaluation_interval: 30s

tests:
  - name: outbox lag, both lanes, both severities
    interval: 30s
    input_series:
      - series: 'organization_outbox_oldest_unpublished_age_seconds{consumer="foundation-reference",lane="priority"}'
        values: '10 45 150'
      - series: 'organization_outbox_oldest_unpublished_age_seconds{consumer="foundation-reference",lane="standard"}'
        values: '100 400 1000'
      - series: 'organization_outbox_unpublished{consumer="foundation-reference",lane="priority"}'
        values: '1 1 1'
      - series: 'organization_dead_letters_unresolved_unwaived'
        values: '0 0 0'
    alert_rule_test:
      - eval_time: 0s
        alertname: PriorityOutboxLagWarning
        exp_alerts: []
      - eval_time: 30s
        alertname: PriorityOutboxLagWarning
        exp_alerts:
          - exp_labels: { severity: warning, consumer: foundation-reference, lane: priority }
            exp_annotations:
              summary: A security event has waited over 30s to be published.
              description: The consumer's dispatcher is behind on the priority lane. A revocation accepted now is not yet on its way to that consumer.
      - eval_time: 30s
        alertname: PriorityOutboxLagCritical
        exp_alerts: []
      - eval_time: 60s
        alertname: PriorityOutboxLagCritical
        exp_alerts:
          - exp_labels: { severity: critical, consumer: foundation-reference, lane: priority }
            exp_annotations:
              summary: A security event has waited over 2 minutes to be published.
              description: Revocation enforcement is past its budget. Check the dispatcher and the consumer endpoint.
      - eval_time: 0s
        alertname: StandardOutboxLagWarning
        exp_alerts: []
      - eval_time: 30s
        alertname: StandardOutboxLagWarning
        exp_alerts:
          - exp_labels: { severity: warning, consumer: foundation-reference, lane: standard }
            exp_annotations:
              summary: A lifecycle event has waited over 5 minutes to be published.
      - eval_time: 60s
        alertname: StandardOutboxLagCritical
        exp_alerts:
          - exp_labels: { severity: critical, consumer: foundation-reference, lane: standard }
            exp_annotations:
              summary: A lifecycle event has waited over 15 minutes to be published.
      - eval_time: 60s
        alertname: EnforcementTelemetryAbsent
        exp_alerts: []

  - name: security debt and a stale dead letter
    interval: 30s
    input_series:
      - series: 'organization_security_debt_dead_letters{consumer="foundation-reference"}'
        values: '0 1'
      - series: 'organization_dead_letters_oldest_unresolved_unwaived_age_seconds'
        values: '3600 90000'
    alert_rule_test:
      - eval_time: 0s
        alertname: SecurityDebt
        exp_alerts: []
      - eval_time: 30s
        alertname: SecurityDebt
        exp_alerts:
          - exp_labels: { severity: critical, consumer: foundation-reference }
            exp_annotations:
              summary: An authority-bearing event was dead-lettered at this consumer, and its projection-backed checks are refusing.
              description: Replay it, then resolve it (TDD-organization-control-005 §Operational Notes).
      - eval_time: 0s
        alertname: UnresolvedDeadLetterStale
        exp_alerts: []
      - eval_time: 30s
        alertname: UnresolvedDeadLetterStale
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: A dead letter has been open for over 24 hours with no waiver.

  - name: a consumer past its own budget, and one within it
    interval: 30s
    input_series:
      - series: 'organization_projection_consumer_report_age_seconds{consumer="late",deployable="organization-control",system="SAD-004"}'
        values: '120'
      - series: 'organization_projection_consumer_max_accepted_age_seconds{consumer="late",deployable="organization-control",system="SAD-004"}'
        values: '60'
      - series: 'organization_projection_consumer_report_age_seconds{consumer="fresh",deployable="organization-control",system="SAD-004"}'
        values: '30'
      - series: 'organization_projection_consumer_max_accepted_age_seconds{consumer="fresh",deployable="organization-control",system="SAD-004"}'
        values: '60'
    alert_rule_test:
      - eval_time: 0s
        alertname: ConsumerProjectionStale
        exp_alerts:
          - exp_labels: { severity: critical, consumer: late, deployable: organization-control, system: SAD-004 }
            exp_annotations:
              summary: A registered consumer has not reported progress within its declared budget.
              description: Under fail_closed it is refusing; under fail_open it is serving authority older than it declared acceptable.

  - name: fresh-check ratio
    interval: 30s
    input_series:
      - series: 'organization_projection_consumer_verify_ratio{consumer="c"}'
        values: '0.01 0.1 0.6'
    alert_rule_test:
      - eval_time: 0s
        alertname: ConsumerFreshCheckRateWarning
        exp_alerts: []
      - eval_time: 30s
        alertname: ConsumerFreshCheckRateWarning
        exp_alerts:
          - exp_labels: { severity: warning, consumer: c }
            exp_annotations:
              summary: A consumer is using the fresh check on more than 5 in 100 requests.
      - eval_time: 30s
        alertname: ConsumerFreshCheckRateCritical
        exp_alerts: []
      - eval_time: 60s
        alertname: ConsumerFreshCheckRateCritical
        exp_alerts:
          - exp_labels: { severity: critical, consumer: c }
            exp_annotations:
              summary: A consumer is using the fresh check on more than half its requests.

  - name: no telemetry at all
    interval: 1m
    input_series: []
    alert_rule_test:
      - eval_time: 5m
        alertname: EnforcementTelemetryAbsent
        exp_alerts: []
      - eval_time: 11m
        alertname: EnforcementTelemetryAbsent
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: organization-control has exported no enforcement metrics for 10 minutes.
              description: Either the process is down, OTEL_EXPORTER_OTLP_ENDPOINT is unset, or the Collector is not receiving. Every alert above is blind until this clears.

  - name: an extra finding, and a security event past its budget
    interval: 30s
    input_series:
      - series: 'organization_projection_consumer_extra_findings{consumer="identity-control"}'
        values: '0 2 0'
      - series: 'organization_enforcement_oldest_unapplied_age_seconds{consumer="identity-control"}'
        values: '5 15 25'
    alert_rule_test:
      - eval_time: 0s
        alertname: ReconciliationExtraFinding
        exp_alerts: []
      - eval_time: 30s
        alertname: ReconciliationExtraFinding
        exp_alerts:
          - exp_labels: { severity: critical, consumer: identity-control }
            exp_annotations:
              summary: The consumer's last reconciliation found access it serves that authority does not grant.
              description: A security incident at any count. It holds until a reconciliation of this consumer finds none (docs/runbooks/projection-drift-repair.md).
      - eval_time: 60s
        alertname: ReconciliationExtraFinding
        exp_alerts: []
      - eval_time: 0s
        alertname: AcceptToEnforcementOverBudget
        exp_alerts: []
      - eval_time: 30s
        alertname: AcceptToEnforcementOverBudget
        exp_alerts:
          - exp_labels: { severity: warning, consumer: identity-control }
            exp_annotations:
              summary: A security event accepted over 10s ago is not yet applied by this consumer.
              description: The propagation budget is 10s (TDD-organization-control-002 §Enforcement Budget). Withdrawn access may still be served there (docs/runbooks/revocation-not-enforced.md).
      - eval_time: 30s
        alertname: AcceptToEnforcementCritical
        exp_alerts: []
      - eval_time: 60s
        alertname: AcceptToEnforcementCritical
        exp_alerts:
          - exp_labels: { severity: critical, consumer: identity-control }
            exp_annotations:
              summary: A security event accepted over 20s ago, twice the budget, is not yet applied by this consumer.

  - name: offboarding and provisioning
    interval: 30s
    input_series:
      - series: 'organization_offboarding_obligations_overdue'
        values: '0 1'
      - series: 'organization_offboarding_in_progress'
        values: '1 1'
      - series: 'organization_offboarding_oldest_in_progress_age_seconds'
        values: '2000000 3000000 8000000'
      - series: 'organization_provisioning_requests{operation="deprovision",state="unresolved"}'
        values: '0 1'
      - series: 'organization_provisioning_oldest_request_age_seconds{operation="deprovision",state="unresolved"}'
        values: '0 3600 90000'
      - series: 'organization_provisioning_requests{operation="provision",state="unresolved"}'
        values: '0 1'
      - series: 'organization_provisioning_oldest_request_age_seconds{operation="provision",state="requested"}'
        values: '1800 4000 20000'
    alert_rule_test:
      - eval_time: 0s
        alertname: OffboardingObligationOverdue
        exp_alerts: []
      - eval_time: 30s
        alertname: OffboardingObligationOverdue
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: An offboarding obligation is open past its due date.
              description: Chase the owning domain (docs/runbooks/stuck-offboarding.md).
      - eval_time: 0s
        alertname: OffboardingReleaseAmbiguous
        exp_alerts: []
      - eval_time: 30s
        alertname: OffboardingReleaseAmbiguous
        exp_alerts:
          - exp_labels: { severity: warning, operation: deprovision, state: unresolved }
            exp_annotations:
              summary: An offboarding is held in release by an ambiguous deprovisioning outcome.
      - eval_time: 30s
        alertname: OffboardingReleaseAmbiguousCritical
        exp_alerts: []
      - eval_time: 60s
        alertname: OffboardingReleaseAmbiguousCritical
        exp_alerts:
          - exp_labels: { severity: critical, operation: deprovision, state: unresolved }
            exp_annotations:
              summary: An offboarding has been held in release by an ambiguous deprovisioning outcome for over 24 hours.
      - eval_time: 0s
        alertname: OffboardingProlongedWarning
        exp_alerts: []
      - eval_time: 30s
        alertname: OffboardingProlongedWarning
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: A Tenant has been offboarding for over 30 days.
      - eval_time: 30s
        alertname: OffboardingProlongedCritical
        exp_alerts: []
      - eval_time: 60s
        alertname: OffboardingProlongedCritical
        exp_alerts:
          - exp_labels: { severity: critical }
            exp_annotations:
              summary: A Tenant has been offboarding for over 90 days.
      - eval_time: 0s
        alertname: ProvisioningUnresolved
        exp_alerts: []
      - eval_time: 30s
        alertname: ProvisioningUnresolved
        exp_alerts:
          - exp_labels: { severity: warning, operation: provision, state: unresolved }
            exp_annotations:
              summary: A provisioning request timed out with no outcome; the boundary may or may not exist.
              description: Never retried automatically (docs/runbooks/provisioning.md).
      - eval_time: 0s
        alertname: ProvisioningStuckWarning
        exp_alerts: []
      - eval_time: 30s
        alertname: ProvisioningStuckWarning
        exp_alerts:
          - exp_labels: { severity: warning, operation: provision, state: requested }
            exp_annotations:
              summary: A provisioning request has been in flight for over an hour.
      - eval_time: 30s
        alertname: ProvisioningStuckCritical
        exp_alerts: []
      - eval_time: 60s
        alertname: ProvisioningStuckCritical
        exp_alerts:
          - exp_labels: { severity: critical, operation: provision, state: requested }
            exp_annotations:
              summary: A provisioning request has been in flight for over four hours.
      - eval_time: 60s
        alertname: LifecycleTelemetryAbsent
        exp_alerts: []

  - name: unresolved provisioning past two reconcile intervals
    interval: 30s
    input_series:
      - series: 'organization_provisioning_oldest_request_age_seconds{operation="provision",state="unresolved"}'
        values: '600 1700 1900'
      - series: 'organization_provisioning_oldest_request_age_seconds{operation="deprovision",state="unresolved"}'
        values: '5000 5000 5000'
      - series: 'organization_sweep_interval_seconds{sweep="provisioning_unresolved"}'
        values: '900 900 900'
      - series: 'organization_sweep_interval_seconds{sweep="invitation_expiry"}'
        values: '60 60 60'
    alert_rule_test:
      # 1700s is under two 15-minute intervals; the invitation sweep's 60s interval must not be read.
      - eval_time: 30s
        alertname: ProvisioningUnresolvedCritical
        exp_alerts: []
      - eval_time: 60s
        alertname: ProvisioningUnresolvedCritical
        exp_alerts:
          - exp_labels: { severity: critical, operation: provision, state: unresolved }
            exp_annotations:
              summary: A provisioning request has been unresolved for longer than two reconcile intervals.
              description: Ask the provisioning system whether the boundary exists, then report realized or failed (docs/runbooks/provisioning.md). Never retried automatically.

  - name: the critical follows the configured interval
    interval: 30s
    input_series:
      - series: 'organization_provisioning_oldest_request_age_seconds{operation="provision",state="unresolved"}'
        values: '1900 1900'
      - series: 'organization_sweep_interval_seconds{sweep="provisioning_unresolved"}'
        values: '1800 1800'
    alert_rule_test:
      - eval_time: 30s
        alertname: ProvisioningUnresolvedCritical
        exp_alerts: []

  - name: a stopped sweep, and one that keeps succeeding
    interval: 1m
    input_series:
      # Last succeeded at the start and never again, on a 15-minute interval.
      - series: 'organization_sweep_last_success_timestamp_seconds{sweep="provisioning_unresolved"}'
        values: '0x60'
      - series: 'organization_sweep_interval_seconds{sweep="provisioning_unresolved"}'
        values: '900x60'
      # Succeeds every minute on a 15-minute interval.
      - series: 'organization_sweep_last_success_timestamp_seconds{sweep="invitation_expiry"}'
        values: '0+60x60'
      - series: 'organization_sweep_interval_seconds{sweep="invitation_expiry"}'
        values: '900x60'
    alert_rule_test:
      # Two intervals is 30 minutes; the alert holds 5 more before it fires.
      - eval_time: 33m
        alertname: ScheduledSweepStopped
        exp_alerts: []
      - eval_time: 37m
        alertname: ScheduledSweepStopped
        exp_alerts:
          - exp_labels: { severity: warning, sweep: provisioning_unresolved }
            exp_annotations:
              summary: A scheduled sweep has not succeeded for two of its intervals.
              description: Unanswered provisioning requests are not aged to unresolved, or lapsed invitations are not expired, while it lasts. The process logs each failure as "scheduled sweep failed" with the sweep's name (docs/runbooks/provisioning.md).

  - name: no lifecycle telemetry
    interval: 1m
    input_series:
      - series: 'organization_dead_letters_unresolved_unwaived'
        values: '0x15'
    alert_rule_test:
      - eval_time: 5m
        alertname: LifecycleTelemetryAbsent
        exp_alerts: []
      - eval_time: 11m
        alertname: LifecycleTelemetryAbsent
        exp_alerts:
          - exp_labels: { severity: warning }
            exp_annotations:
              summary: organization-control has exported no offboarding or provisioning metric for 10 minutes.
              description: The lifecycle alerts above are blind. The view operation.lifecycle_signals may be missing, or the process is not exporting.

  - name: isolation refusals
    interval: 1m
    input_series:
      - series: 'organization_isolation_refusals_total{control="with_check"}'
        values: '0 0 0 1 1'
      - series: 'organization_isolation_refusals_total{control="unset_binding"}'
        values: '0 0 1 1 6'
    alert_rule_test:
      - eval_time: 2m
        alertname: IsolationWithCheckRejection
        exp_alerts: []
      - eval_time: 3m
        alertname: IsolationWithCheckRejection
        exp_alerts:
          - exp_labels: { severity: critical, control: with_check }
            exp_annotations:
              summary: The database refused a write into a Tenant the transaction was not bound to.
              description: A defect or an attack, treated as a security finding (docs/runbooks/with-check-rejection.md).
      - eval_time: 1m
        alertname: IsolationUnsetBindingWarning
        exp_alerts: []
      - eval_time: 2m
        alertname: IsolationUnsetBindingWarning
        exp_alerts:
          - exp_labels: { severity: warning, control: unset_binding }
            exp_annotations:
              summary: A statement reached a Row-Level Security policy with no scope bound.
              description: docs/runbooks/unset-binding.md
      - eval_time: 3m
        alertname: IsolationUnsetBindingCritical
        exp_alerts: []
      - eval_time: 4m
        alertname: IsolationUnsetBindingCritical
        exp_alerts:
          - exp_labels: { severity: critical, control: unset_binding }
            exp_annotations:
              summary: Five or more statements in an hour reached a Row-Level Security policy with no scope bound.
