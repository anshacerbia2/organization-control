# Enforcement alerts for organization-control (ROADMAP item 14).
#
# The series come from internal/telemetry, exported over OTLP to the Collector and converted to
# Prometheus names there: dots to underscores, a seconds unit to _seconds, a ratio to _ratio.
# internal/telemetry's test fails if a name here is not one it exports.
#
# Thresholds, and where each is set:
#   outbox lag, priority     warning 30s, critical 2m      SAD-004 §9.3.2, TDD-foundation-platform-001
#   outbox lag, standard     warning 5m, critical 15m      TDD-foundation-platform-001 §Operational Notes
#   security debt            critical at any occurrence    TDD-foundation-platform-001, TDD-005
#   unresolved dead letter   warning past 24h, unwaived    TDD-foundation-platform-001, TDD-005 §WAIVED
#   consumer report age      critical past its budget      TDD-002 §Operational Notes
#   verify ratio             warning 0.05, critical 0.5    TDD-002 §Configuration, ORGANIZATION_VERIFY_RATE_ALERT
#   extra finding            critical at any occurrence    TDD-002 §Operational Notes
#   accept to enforcement    warning 10s, critical 20s     TDD-002 §Operational Notes, §Enforcement Budget
#   obligation past due      warning at any occurrence     TDD-004 §Operational Notes
#   ambiguous release        warning any, critical 24h     TDD-004 §Operational Notes
#   offboarding duration     warning 30d, critical 90d     TDD-004 §Operational Notes
#   unresolved provisioning  warning at any occurrence,    TDD-003 §Operational Notes
#                            critical past two reconcile intervals
#   scheduled sweep stopped  warning past two intervals    TDD-003 §Scheduled Sweeps
#   provisioning in flight   warning 1h, critical 4h       TDD-003 §Operational Notes
#   WITH CHECK rejection     critical at any occurrence    TDD-001 §Operational Notes
#   unset binding            warning any, critical 5/hour  TDD-001 §Operational Notes
#
# Each alert has a runbook in docs/runbooks (README there maps alert to runbook).
#
# Lag and debt carry a consumer label: each consumer has its own deliveries and dead letters
# (ADR-GLB-018), so an alert names the consumer that is behind or refusing.
#
# Evaluated by whichever Prometheus-compatible backend the Collector feeds; promtool tests them in CI.

groups:
  - name: organization-control-enforcement
    rules:
      - alert: PriorityOutboxLagWarning
        expr: organization_outbox_oldest_unpublished_age_seconds{lane="priority"} > 30
        labels:
          severity: warning
        annotations:
          summary: A security event has waited over 30s to be published.
          description: The consumer's dispatcher is behind on the priority lane. A revocation accepted now is not yet on its way to that consumer.

      - alert: PriorityOutboxLagCritical
        expr: organization_outbox_oldest_unpublished_age_seconds{lane="priority"} > 120
        labels:
          severity: critical
        annotations:
          summary: A security event has waited over 2 minutes to be published.
          description: Revocation enforcement is past its budget. Check the dispatcher and the consumer endpoint.

      - alert: StandardOutboxLagWarning
        expr: organization_outbox_oldest_unpublished_age_seconds{lane="standard"} > 300
        labels:
          severity: warning
        annotations:
          summary: A lifecycle event has waited over 5 minutes to be published.

      - alert: StandardOutboxLagCritical
        expr: organization_outbox_oldest_unpublished_age_seconds{lane="standard"} > 900
        labels:
          severity: critical
        annotations:
          summary: A lifecycle event has waited over 15 minutes to be published.

      - alert: SecurityDebt
        expr: organization_security_debt_dead_letters > 0
        labels:
          severity: critical
        annotations:
          summary: An authority-bearing event was dead-lettered at this consumer, and its projection-backed checks are refusing.
          description: Replay it, then resolve it (TDD-organization-control-005 §Operational Notes).

      - alert: UnresolvedDeadLetterStale
        expr: organization_dead_letters_oldest_unresolved_unwaived_age_seconds > 86400
        labels:
          severity: warning
        annotations:
          summary: A dead letter has been open for over 24 hours with no waiver.

      - alert: ConsumerProjectionStale
        expr: >
          organization_projection_consumer_report_age_seconds
            > on (consumer, deployable, system) organization_projection_consumer_max_accepted_age_seconds
        labels:
          severity: critical
        annotations:
          summary: A registered consumer has not reported progress within its declared budget.
          description: Under fail_closed it is refusing; under fail_open it is serving authority older than it declared acceptable.

      - alert: ConsumerFreshCheckRateWarning
        expr: organization_projection_consumer_verify_ratio > 0.05
        labels:
          severity: warning
        annotations:
          summary: A consumer is using the fresh check on more than 5 in 100 requests.

      - alert: ConsumerFreshCheckRateCritical
        expr: organization_projection_consumer_verify_ratio > 0.5
        labels:
          severity: critical
        annotations:
          summary: A consumer is using the fresh check on more than half its requests.

      - alert: EnforcementTelemetryAbsent
        # The stale count, because it is reported whether or not any consumer is registered; the lag
        # and debt series exist only per active consumer.
        expr: absent(organization_dead_letters_unresolved_unwaived)
        for: 10m
        labels:
          severity: critical
        annotations:
          summary: organization-control has exported no enforcement metrics for 10 minutes.
          description: Either the process is down, OTEL_EXPORTER_OTLP_ENDPOINT is unset, or the Collector is not receiving. Every alert above is blind until this clears.

      - alert: ReconciliationExtraFinding
        expr: organization_projection_consumer_extra_findings > 0
        labels:
          severity: critical
        annotations:
          summary: The consumer's last reconciliation found access it serves that authority does not grant.
          description: A security incident at any count. It holds until a reconciliation of this consumer finds none (docs/runbooks/projection-drift-repair.md).

      - alert: AcceptToEnforcementOverBudget
        expr: organization_enforcement_oldest_unapplied_age_seconds > 10
        labels:
          severity: warning
        annotations:
          summary: A security event accepted over 10s ago is not yet applied by this consumer.
          description: The propagation budget is 10s (TDD-organization-control-002 §Enforcement Budget). Withdrawn access may still be served there (docs/runbooks/revocation-not-enforced.md).

      - alert: AcceptToEnforcementCritical
        expr: organization_enforcement_oldest_unapplied_age_seconds > 20
        labels:
          severity: critical
        annotations:
          summary: A security event accepted over 20s ago, twice the budget, is not yet applied by this consumer.

  - name: organization-control-lifecycle
    rules:
      - alert: OffboardingObligationOverdue
        expr: organization_offboarding_obligations_overdue > 0
        labels:
          severity: warning
        annotations:
          summary: An offboarding obligation is open past its due date.
          description: Chase the owning domain (docs/runbooks/stuck-offboarding.md).

      - alert: OffboardingReleaseAmbiguous
        expr: organization_provisioning_requests{operation="deprovision",state="unresolved"} > 0
        labels:
          severity: warning
        annotations:
          summary: An offboarding is held in release by an ambiguous deprovisioning outcome.

      - alert: OffboardingReleaseAmbiguousCritical
        expr: organization_provisioning_oldest_request_age_seconds{operation="deprovision",state="unresolved"} > 86400
        labels:
          severity: critical
        annotations:
          summary: An offboarding has been held in release by an ambiguous deprovisioning outcome for over 24 hours.

      - alert: OffboardingProlongedWarning
        expr: organization_offboarding_oldest_in_progress_age_seconds > 2592000
        labels:
          severity: warning
        annotations:
          summary: A Tenant has been offboarding for over 30 days.

      - alert: OffboardingProlongedCritical
        expr: organization_offboarding_oldest_in_progress_age_seconds > 7776000
        labels:
          severity: critical
        annotations:
          summary: A Tenant has been offboarding for over 90 days.

      - alert: ProvisioningUnresolved
        expr: organization_provisioning_requests{operation="provision",state="unresolved"} > 0
        labels:
          severity: warning
        annotations:
          summary: A provisioning request timed out with no outcome; the boundary may or may not exist.
          description: Never retried automatically (docs/runbooks/provisioning.md).

      - alert: ProvisioningUnresolvedCritical
        # The age runs from when the sweep found the request ambiguous. The threshold is read from the
        # configured interval rather than written here, so it follows ORGANIZATION_PROVISIONING_RECONCILE_INTERVAL.
        expr: >
          organization_provisioning_oldest_request_age_seconds{operation="provision",state="unresolved"}
            > ignoring (operation, state, sweep) group_left
          2 * organization_sweep_interval_seconds{sweep="provisioning_unresolved"}
        labels:
          severity: critical
        annotations:
          summary: A provisioning request has been unresolved for longer than two reconcile intervals.
          description: Ask the provisioning system whether the boundary exists, then report realized or failed (docs/runbooks/provisioning.md). Never retried automatically.

      - alert: ProvisioningStuckWarning
        expr: organization_provisioning_oldest_request_age_seconds{operation="provision",state="requested"} > 3600
        labels:
          severity: warning
        annotations:
          summary: A provisioning request has been in flight for over an hour.

      - alert: ProvisioningStuckCritical
        expr: organization_provisioning_oldest_request_age_seconds{operation="provision",state="requested"} > 14400
        labels:
          severity: critical
        annotations:
          summary: A provisioning request has been in flight for over four hours.

      - alert: LifecycleTelemetryAbsent
        expr: absent(organization_offboarding_in_progress)
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: organization-control has exported no offboarding or provisioning metric for 10 minutes.
          description: The lifecycle alerts above are blind. The view operation.lifecycle_signals may be missing, or the process is not exporting.

  - name: organization-control-schedules
    rules:
      - alert: ScheduledSweepStopped
        # Two intervals without a success, held 5 minutes: "at least enough time for 2 full runs"
        # (Prometheus, Alerting, Batch jobs). The last success starts at the process's start, so a
        # sweep that has never succeeded fires in the same time as one that stopped.
        expr: >
          time() - organization_sweep_last_success_timestamp_seconds
            > 2 * organization_sweep_interval_seconds
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: A scheduled sweep has not succeeded for two of its intervals.
          description: Unanswered provisioning requests are not aged to unresolved, or lapsed invitations are not expired, while it lasts. The process logs each failure as "scheduled sweep failed" with the sweep's name (docs/runbooks/provisioning.md).

  - name: organization-control-isolation
    rules:
      - alert: IsolationWithCheckRejection
        expr: increase(organization_isolation_refusals_total{control="with_check"}[15m]) > 0
        labels:
          severity: critical
        annotations:
          summary: The database refused a write into a Tenant the transaction was not bound to.
          description: A defect or an attack, treated as a security finding (docs/runbooks/with-check-rejection.md).

      - alert: IsolationUnsetBindingWarning
        expr: increase(organization_isolation_refusals_total{control="unset_binding"}[1h]) > 0
        labels:
          severity: warning
        annotations:
          summary: A statement reached a Row-Level Security policy with no scope bound.
          description: docs/runbooks/unset-binding.md

      - alert: IsolationUnsetBindingCritical
        expr: increase(organization_isolation_refusals_total{control="unset_binding"}[1h]) >= 5
        labels:
          severity: critical
        annotations:
          summary: Five or more statements in an hour reached a Row-Level Security policy with no scope bound.
